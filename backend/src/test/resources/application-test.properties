spring.datasource.url=jdbc:h2:mem:wallet;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha
app.jwt.expiration-ms=3600000
app.openai.api-key=
app.cors.allowed-origins=http://localhost:5173
app.rate-limit.auth-per-minute=1000
app.rate-limit.categorize-per-minute=1000
