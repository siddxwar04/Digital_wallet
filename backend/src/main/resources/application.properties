spring.application.name=digital-wallet-backend
server.port=${SERVER_PORT:8080}

# Prefer env vars in real deployments. Local defaults are for development only.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/digital_wallet}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}

# JWT — override JWT_SECRET in any shared/deployed environment (min 32 chars)
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS — comma-separated origins
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# OpenAI — leave blank to run without the LLM (unmatched descriptions become OTHER)
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
app.openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:10}

# Lightweight in-memory rate limits (per client IP)
app.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH:30}
app.rate-limit.categorize-per-minute=${RATE_LIMIT_CATEGORIZE:60}
