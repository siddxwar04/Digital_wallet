spring.application.name=digital-wallet-backend
server.port=8080

# PostgreSQL — update username/password for your local setup
spring.datasource.url=jdbc:postgresql://localhost:5432/digital_wallet
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT — change this secret in production (must be at least 256 bits / 32 chars)
app.jwt.secret=change-this-to-a-long-random-secret-key-at-least-32-chars
app.jwt.expiration-ms=86400000

# OpenAI — leave the key blank to run without the LLM (unmatched descriptions become OTHER)
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=gpt-4o-mini
app.openai.base-url=https://api.openai.com
app.openai.timeout-seconds=10
